# Estas opciones se aplican automáticamente a TODOS los .qmd
# que estén en carpetas capitulo-XX/ y usen format: revealjs.
# Evita repetir la configuración en cada archivo.

format:
  revealjs:
    theme: simple
    slide-number: true
    progress: true
    transition: slide
    background-transition: fade
    code-line-numbers: true
    highlight-style: github
    css: ../styles.css
    # --- Fórmulas matemáticas ---
    html-math-method: mathjax   # habilita LaTeX ($...$ y $$...$$) automáticamente
    # --- Video ---
    preview-links: auto
    # --- Navegación ---
    controls: true
    hash: true
